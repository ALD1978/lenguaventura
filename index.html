<title>Lenguaventura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: una columna central tipo "cuaderno de misiones"; cada mundo tiene su color */
:root{
  --bg:#EEF2FB; --surface:#FFFFFF; --surface2:#F5F7FD; --ink:#1B2545; --muted:#5D6787; --line:#D9DFEF;
  --accent:#FF6B35; --accent-ink:#FFFFFF;
  --c1:#3767F0; --c2:#E0457B; --c3:#14A06C; --c4:#E59A00; --c5:#7B5CF0; --c6:#0E8F9B; --c7:#9A5B22; --c8:#B0388F; --c9:#C2410C; --c10:#4D7C0F; --c11:#BE123C;
  --ok:#139A52; --ok-bg:#DDF5E7; --ko:#D23F3F; --ko-bg:#FBE1E1; --star:#FFB400;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111729; --surface:#1B2340; --surface2:#222C4E; --ink:#E9EDFF; --muted:#A3ADD0; --line:#2F3A63;
  --accent:#FF8350; --accent-ink:#1B1200;
  --c1:#6E92FF; --c2:#FF6E9F; --c3:#3FCB93; --c4:#FFBE3B; --c5:#A48CFF; --c6:#3CC6D2; --c7:#E0A462; --c8:#F07BCB; --c9:#FB923C; --c10:#A3E635; --c11:#FB7185;
  --ok:#4BD98A; --ok-bg:#183C2B; --ko:#FF7B7B; --ko-bg:#4A2026; --star:#FFC83D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111729; --surface:#1B2340; --surface2:#222C4E; --ink:#E9EDFF; --muted:#A3ADD0; --line:#2F3A63;
  --accent:#FF8350; --accent-ink:#1B1200;
  --c1:#6E92FF; --c2:#FF6E9F; --c3:#3FCB93; --c4:#FFBE3B; --c5:#A48CFF; --c6:#3CC6D2; --c7:#E0A462; --c8:#F07BCB; --c9:#FB923C; --c10:#A3E635; --c11:#FB7185;
  --ok:#4BD98A; --ok-bg:#183C2B; --ko:#FF7B7B; --ko-bg:#4A2026; --star:#FFC83D; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:820px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;font-weight:800;font-size:17px;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.sec{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sm{min-height:42px;padding:0 14px;font-size:15px}
.muted{color:var(--muted)}

/* Cabecera */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.who{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 16px 4px 4px;font-weight:800}
.ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--surface2);overflow:hidden}
.ava svg,.avs svg{width:100%;height:100%;display:block}
.mini{display:inline-block;width:24px;height:24px;vertical-align:middle}.mini svg{width:100%;height:100%}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE38A,#F2A900 70%);box-shadow:inset 0 -2px 0 #C98500}

/* Perfiles */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.pcard{background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--display);font-size:28px;font-weight:800}
.pcard .ava{width:96px;height:96px;font-size:58px}
.pcard:active{transform:scale(.98)}
.hero{padding-block:12px 8px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{width:min(180px,40vw);height:auto;border-radius:28px;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 18%,transparent)}
.hero h1{font-size:clamp(38px,7vw,58px);letter-spacing:-.5px}
.hero h1 span{color:var(--accent)}
.hero p{margin:6px 0 0;color:var(--muted);font-size:18px}

/* Mapa */
.worlds{display:grid;gap:16px}
.world{background:var(--surface);border-radius:var(--r);border:2px solid var(--line);overflow:hidden}
.whead{display:flex;align-items:center;gap:14px;padding:16px 18px;background:color-mix(in srgb,var(--wc) 14%,var(--surface))}
.wicon{width:52px;height:52px;border-radius:14px;background:var(--wc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;flex:none}
.whead h2{font-size:24px}
.whead p{margin:0;color:var(--muted);font-size:15px}
.whead .btn{margin-left:auto}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px}
.lvl{min-height:104px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.lvl b{font-family:var(--display);font-size:17px;line-height:1.15}
.lvl small{color:var(--muted);font-size:13px;line-height:1.25}
.lvl .stars{margin-top:auto}
.lvl.open{border-color:var(--wc);box-shadow:0 3px 0 color-mix(in srgb,var(--wc) 55%,transparent)}
.lvl.locked{opacity:.55}
.stars{display:flex;gap:2px;font-size:18px;color:var(--line)}
.stars .on{color:var(--star)}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.xcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;gap:14px;align-items:center}
.xcard .wicon{background:var(--wc)}
.xcard b{font-family:var(--display);font-size:20px;display:block}
.xcard small{color:var(--muted)}
@media (max-width:560px){.levels{grid-template-columns:1fr}.lvl{min-height:0}.whead .btn{display:none}}

/* Juego */
.gbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--surface);border:2px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--wc,var(--accent));border-radius:99px;transition:width .3s}
.x{width:44px;height:44px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-size:22px;font-weight:800}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px}
.tema{display:inline-block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--wc,var(--accent));margin-bottom:6px}
.enun{font-family:var(--display);font-size:clamp(24px,4.4vw,32px);font-weight:700;line-height:1.15}
.sub{margin-top:6px;color:var(--muted);font-weight:700}
.frase{margin-top:14px;font-size:22px;background:var(--surface2);border-radius:14px;padding:14px 16px;line-height:1.7}
.frase mark{background:color-mix(in srgb,var(--wc,var(--accent)) 25%,transparent);color:inherit;border-bottom:3px solid var(--wc,var(--accent));padding:0 3px;border-radius:4px;font-weight:800}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.opt{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);padding:10px 14px;font-weight:800;font-size:18px;text-align:left;box-shadow:0 3px 0 var(--line)}
.opt:active{transform:translateY(2px)}
.opt.good{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.opt.bad{background:var(--ko-bg);border-color:var(--ko);box-shadow:0 3px 0 var(--ko)}
.opt:disabled{cursor:default}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.words{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:baseline;margin-top:16px;font-size:22px;background:var(--surface2);padding:14px;border-radius:14px}
.word{padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.word.good{background:var(--ok-bg);border-color:var(--ok)}
.word.bad{background:var(--ko-bg);border-color:var(--ko)}
.write{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.write input{flex:1;min-width:0;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:22px;font-weight:700;padding:0 16px}
.write input.good{border-color:var(--ok);background:var(--ok-bg)}
.write input.bad{border-color:var(--ko);background:var(--ko-bg)}
.keys{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.keys button{width:46px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:20px}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.fb.good{background:var(--ok-bg)}
.fb.bad{background:var(--ko-bg)}
.fb .t{font-family:var(--display);font-size:24px;font-weight:800}
.fb.good .t{color:var(--ok)} .fb.bad .t{color:var(--ko)}
.fb p{margin:2px 0 0}
.fb .body{flex:1;min-width:220px}
.fb .btn{align-self:center}
.timer{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.streak{font-weight:800;color:var(--accent)}

.order{display:grid;gap:10px;margin-top:18px}
.oitem{display:flex;align-items:center;gap:12px;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);padding:8px 14px;text-align:left;font-weight:700;font-size:17px}
.oitem .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);font-family:var(--display);font-weight:800}
.oitem.sel .n{background:var(--wc,var(--accent));border:0;color:#fff}
.oitem.good{border-color:var(--ok);background:var(--ok-bg)} .oitem.bad{border-color:var(--ko);background:var(--ko-bg)}
.lectura{background:var(--surface2);border-radius:14px;padding:14px 16px;margin-top:10px}
.lectura p{margin:6px 0}
.lectura .parte{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--c7)}
/* Resultado */
.res{text-align:center;padding:30px 20px}
.bigstars{display:flex;justify-content:center;gap:10px;font-size:64px;color:var(--line);margin:10px 0}
.bigstars .on{color:var(--star);animation:pop .5s both}
.bigstars .on:nth-child(2){animation-delay:.2s}.bigstars .on:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.res .score{font-family:var(--display);font-size:44px;font-weight:800}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* Teoría */
.theory h2{font-size:28px;margin-bottom:8px}
.theory h3{font-size:21px;margin:18px 0 6px}
.theory p,.theory li{max-width:65ch}
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;font-size:15px;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{background:var(--surface2);font-size:13px}
td.irr{color:var(--c2);font-weight:800}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tbox{background:var(--surface2);border-radius:14px;padding:12px 14px}
.tbox b{font-family:var(--display);font-size:17px}
.tbox .alias{color:var(--muted);font-size:14px}
select{font:inherit;font-weight:700;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 10px}

/* Familia */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center}
.bar .tr{height:14px;background:var(--surface2);border-radius:9px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--c3)}
.bar span{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.list li{background:var(--surface2);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:999px;border:2px solid var(--line);font-weight:800;background:var(--surface)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.avs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.avs button{width:56px;height:56px;border-radius:14px;font-size:32px;border:2px solid var(--line);background:var(--surface2)}
.avs button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.confirm{margin-top:10px;background:var(--ko-bg);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="conf" hidden></canvas>
<div class="wrap" id="app"></div>

<script>
"use strict";
/* ============ utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const uniq = a => [...new Set(a)];
const sinTilde = s => s.replace(/ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\u0001/g,'ñ');
const norm = s => s.toLowerCase().trim().replace(/\s+/g,' ').replace(/[.,;:!¡?¿]+$/,'');

/* ============ VERBOS ============ */
const PERS = [
  {pr:'yo', lab:'1ª persona del singular'},
  {pr:'tú', lab:'2ª persona del singular'},
  {pr:'él / ella / usted', lab:'3ª persona del singular'},
  {pr:'nosotros/as', lab:'1ª persona del plural'},
  {pr:'vosotros/as', lab:'2ª persona del plural'},
  {pr:'ellos / ellas / ustedes', lab:'3ª persona del plural'},
];
const HABER = {
  pres:['he','has','ha','hemos','habéis','han'],
  impf:['había','habías','había','habíamos','habíais','habían'],
  pps:['hube','hubiste','hubo','hubimos','hubisteis','hubieron'],
  fut:['habré','habrás','habrá','habremos','habréis','habrán'],
  cond:['habría','habrías','habría','habríamos','habríais','habrían'],
  spres:['haya','hayas','haya','hayamos','hayáis','hayan'],
  simpf:['hubiera','hubieras','hubiera','hubiéramos','hubierais','hubieran'],
  sfut:['hubiere','hubieres','hubiere','hubiéremos','hubiereis','hubieren'],
};
// n = nombre (libro SM / RAE), b = nombre de Bello que también aparece en el libro, u = uso
const T = [
  {id:'pres', n:'Presente', b:'presente', m:'ind', u:'Acción que ocurre ahora o habitualmente.'},
  {id:'pps', n:'Pretérito perfecto simple', b:'pretérito', m:'ind', u:'Acción pasada y terminada.'},
  {id:'impf', n:'Pretérito imperfecto', b:'copretérito', m:'ind', u:'Acción pasada sin indicar su final; describe o expresa costumbre.'},
  {id:'fut', n:'Futuro simple', b:'futuro', m:'ind', u:'Acción que ocurrirá.'},
  {id:'cond', n:'Condicional simple', b:'pospretérito', m:'ind', u:'Acción posible o que depende de una condición.'},
  {id:'ppc', n:'Pretérito perfecto compuesto', b:'antepresente', m:'ind', aux:'pres', u:'Acción pasada con relación con el presente.'},
  {id:'plus', n:'Pretérito pluscuamperfecto', b:'antecopretérito', m:'ind', aux:'impf', u:'Acción pasada que ocurrió antes de otra pasada.'},
  {id:'pant', n:'Pretérito anterior', b:'antepretérito', m:'ind', aux:'pps', u:'Acción pasada inmediatamente anterior a otra (poco usado).'},
  {id:'futc', n:'Futuro compuesto', b:'antefuturo', m:'ind', aux:'fut', u:'Acción que estará terminada en el futuro.'},
  {id:'condc', n:'Condicional compuesto', b:'antepospretérito', m:'ind', aux:'cond', u:'Acción que podría haber ocurrido si se hubiera cumplido una condición.'},
  {id:'spres', n:'Presente', b:'presente', m:'sub', u:'Deseo, duda o posibilidad en presente o futuro.'},
  {id:'simpf', n:'Pretérito imperfecto', b:'pretérito', m:'sub', u:'Deseo o hipótesis en pasado. Tiene dos formas: -ra / -se.'},
  {id:'sfut', n:'Futuro simple', b:'futuro', m:'sub', u:'Casi no se usa hoy (refranes, textos legales).'},
  {id:'sppc', n:'Pretérito perfecto compuesto', b:'antepresente', m:'sub', aux:'spres', u:'Deseo o duda sobre algo ya terminado.'},
  {id:'splus', n:'Pretérito pluscuamperfecto', b:'antepretérito', m:'sub', aux:'simpf', u:'Hipótesis sobre el pasado que no se cumplió.'},
  {id:'sfutc', n:'Futuro compuesto', b:'antefuturo', m:'sub', aux:'sfut', u:'Casi no se usa hoy.'},
];
const TI = Object.fromEntries(T.map(t=>[t.id,t]));
const modo = t => t.m==='ind' ? 'indicativo' : 'subjuntivo';
const tLab = t => `${t.n} de ${modo(t)}`;
const IND_S = ['pres','pps','impf','fut','cond'];
const IND_C = ['ppc','plus','pant','futc','condc'];
const SUB_S = ['spres','simpf','sfut'];
const SUB_C = ['sppc','splus','sfutc'];
const IND = [...IND_S, ...IND_C], SUB = [...SUB_S, ...SUB_C], ALLT = [...IND, ...SUB];

const END = {
  pres:[['o','as','a','amos','áis','an'],['o','es','e','emos','éis','en'],['o','es','e','imos','ís','en']],
  pps:[['é','aste','ó','amos','asteis','aron'],['í','iste','ió','imos','isteis','ieron'],['í','iste','ió','imos','isteis','ieron']],
  impf:[['aba','abas','aba','ábamos','abais','aban'],['ía','ías','ía','íamos','íais','ían'],['ía','ías','ía','íamos','íais','ían']],
  spres:[['e','es','e','emos','éis','en'],['a','as','a','amos','áis','an'],['a','as','a','amos','áis','an']],
};
const FUT=['é','ás','á','emos','éis','án'], COND=['ía','ías','ía','íamos','íais','ían'];
const SIMPF=['ra','ras','ra','ramos','rais','ran'], SFUT=['re','res','re','remos','reis','ren'];
const grupo = inf => { const e=sinTilde(inf).slice(-2); return e==='ar'?0:e==='er'?1:2; };
const tildeFinal = st => st.replace(/[ae]$/, m=>({a:'á',e:'é'})[m]);
const fromPret = (p3, suf) => { const st=p3.slice(0,-3); return suf.map((s,i)=>(i===3?tildeFinal(st):st)+s); };
function reg(inf, tid){
  const g=grupo(inf), st=inf.slice(0,-2), base=sinTilde(inf);
  if(END[tid]) return END[tid][g].map(e=>st+e);
  if(tid==='fut') return FUT.map(e=>base+e);
  if(tid==='cond') return COND.map(e=>base+e);
  if(tid==='simpf') return fromPret(reg(inf,'pps')[5], SIMPF);
  if(tid==='sfut') return fromPret(reg(inf,'pps')[5], SFUT);
}
function simple(v, tid){
  if(Array.isArray(v[tid])) return v[tid];
  if((tid==='fut'||tid==='cond') && v.fut) return (tid==='fut'?FUT:COND).map(e=>v.fut+e);
  if(tid==='simpf') return fromPret(simple(v,'pps')[5], SIMPF);

const personasDe = (v,tid,f) => conj(v,tid).map((x,i)=>x===f?i:-1).filter(i=>i>=0);
function expTiempo(v, t, f){
  const ps = personasDe(v, t.id, f).map(i=>PERS[i].lab).join(' o ');
  if(t.aux){
    const h = f.split(' ')[0];
    return `Tiempo compuesto: «${h}» (haber en ${TI[t.aux].n.toLowerCase()}) + participio «${part(v)}». También se llama ${t.b}. ${ps}.`;
  }
  return `Tiempo simple: el verbo va en una sola palabra. También se llama ${t.b}. ${ps}.`;
}

/* ---- generadores de verbos ---- */
function qIdent(ask, opt, verbs){
  const v=pick(verbs), t=TI[pick(ask)], f=conj(v,t.id)[rnd(6)];
  const match = ALLT.filter(id=>conj(v,id).includes(f));
  const otros = shuffle(opt.filter(id=>!match.includes(id))).slice(0,3);
  return {tipo:'test', tema:'Identificar el tiempo', enun:`¿En qué tiempo está «${f}»?`, sub:`Verbo ${v.inf}`,
    opciones: shuffle([t.id, ...otros]).map(id=>tLab(TI[id])), resp:tLab(t), exp:expTiempo(v,t,f)};
}
function qPersona(verbs, tenses){
  for(let k=0;k<40;k++){
    const v=pick(verbs), t=TI[pick(tenses)], p=rnd(6), f=conj(v,t.id)[p];
    if(personasDe(v,t.id,f).length>1) continue;
    const otros = shuffle([0,1,2,3,4,5].filter(i=>i!==p)).slice(0,3);
    return {tipo:'test', tema:'Persona y número', enun:`¿Qué persona y número es «${f}»?`, sub:`${v.inf} · ${tLab(t)}`,
      opciones: shuffle([p,...otros]).map(i=>PERS[i].lab), resp:PERS[p].lab, exp:`«${f}» va con ${PERS[p].pr}: ${PERS[p].lab}.`};
  }
  return qIdent(tenses, tenses, verbs);
}
function qSimpleComp(verbs, tenses){
  const v=pick(verbs), t=TI[pick(tenses)], f=conj(v,t.id)[rnd(6)], dice=Math.random()<.5?'compuesto':'simple';
  return {tipo:'vf', tema:'Simple o compuesto', enun:`«${f}» es un tiempo ${dice}.`, resp: (dice==='compuesto')===!!t.aux,
    exp:`«${f}» es ${tLab(t).toLowerCase()}. ${t.aux?'Los tiempos compuestos llevan haber + participio.':'Los tiempos simples son una sola palabra.'}`};
}
function qModo(verbs, tenses){
  const v=pick(verbs), t=TI[pick(tenses)], f=conj(v,t.id)[rnd(6)];
  if(ALLT.filter(id=>TI[id].m!==t.m && conj(v,id).includes(f)).length) return qIdent(tenses,tenses,verbs);
  return {tipo:'test', tema:'Modo verbal', enun:`¿En qué modo está «${f}»?`, sub:`Verbo ${v.inf}`, opciones:['Indicativo','Subjuntivo'],
    resp: t.m==='ind'?'Indicativo':'Subjuntivo', exp:`Es ${tLab(t).toLowerCase()}. ${t.m==='ind'?'El indicativo presenta hechos reales.':'El subjuntivo expresa deseos, dudas o posibilidades (que yo…, ojalá…).'}`};
}
function qBello(tenses){
  const t=TI[pick(tenses)];
  const pool = uniq(T.map(x=>x.b)).filter(b=>b!==t.b);
  return {tipo:'test', tema:'Otros nombres', enun:`¿Qué otro nombre recibe el ${tLab(t).toLowerCase()}?`, sub:'En tu libro aparecen los dos nombres',
    opciones: shuffle([t.b, ...shuffle(pool).slice(0,3)]), resp:t.b, exp:`${tLab(t)} = ${t.b}. ${t.u}`};
}
function qEscribir(verbs, tenses){
  const v=pick(verbs), t=TI[pick(tenses)], p=rnd(6), f=conj(v,t.id)[p];
  const resp = uniq([f, formaSe(f)]);
  const r = conjReg(v,t.id)[p];
  let exp = t.aux ? `haber (${TI[t.aux].n.toLowerCase()}) + participio: «${f}».` : `${tLab(t)} de ${v.inf}: «${f}».`;
  if(r!==f) exp += ` Ojo: no se dice «${r}».`;
  if(resp.length>1) exp += ` También vale «${resp[1]}».`;
  return {tipo:'escribir', tema:'Conjugar', enun:`Conjuga el verbo «${v.inf}»`, sub:`${tLab(t)} · ${PERS[p].pr} (${PERS[p].lab})`, resp, exp};
}
function irrTiempos(v, set){ return set.filter(id=>{const a=conj(v,id), b=conjReg(v,id); return a.some((x,i)=>x!==b[i]);}); }
function elegirIrr(set){
  let v, ts, n=0;
  do { v=pick(IRR); ts=irrTiempos(v,set); } while(!ts.length && ++n<60);
  const tid=pick(ts), a=conj(v,tid), b=conjReg(v,tid);
  const p = pick([0,1,2,3,4,5].filter(i=>a[i]!==b[i]));
  return {v, t:TI[tid], p, ok:a[p], mal:b[p]};
}
function cambiaTilde(f){
  const w=f.split(' '), last=w.length-1;
  if(/[áéíóú]/.test(w[last])) w[last]=sinTilde(w[last]);
  else w[last]=w[last].replace(/([aeiou])([^aeiou]*)$/, (m,vw,rest)=>({a:'á',e:'é',i:'í',o:'ó',u:'ú'})[vw]+rest);
  return w.join(' ');
}
function qIrrTest(set){
  const {v,t,p,ok,mal} = elegirIrr(set);
  let c = [mal, cambiaTilde(ok), cambiaTilde(mal)];
  set.forEach(id=>{ if(id!==t.id) c.push(conj(v,id)[p]); });
  c = shuffle(uniq(c.filter(x=>x!==ok)));
  const m = [mal, ...c.filter(x=>x!==mal)].slice(0,3);
  return {tipo:'test', tema:'Verbos irregulares', enun:'¿Cuál es la forma correcta?', sub:`${v.inf.toUpperCase()} · ${tLab(t)} · ${PERS[p].pr}`,
    opciones: shuffle([ok, ...m]), resp:ok, exp:`Se dice «${ok}». «${mal}» sería la forma regular, pero «${v.inf}» es irregular en este tiempo.`};
}
function qIrrEscribir(set){
  const {v,t,p,ok,mal} = elegirIrr(set);
  return {tipo:'escribir', tema:'Verbos irregulares', enun:`Conjuga el verbo irregular «${v.inf}»`, sub:`${tLab(t)} · ${PERS[p].pr} (${PERS[p].lab})`,
    resp: uniq([ok, formaSe(ok)]), exp:`Se dice «${ok}», no «${mal}».`};
}
function qPart(escribir){
  const v=pick(PARTX), mal=partReg(v.inf);
  if(escribir) return {tipo:'escribir', tema:'Participios irregulares', enun:`Escribe el participio de «${v.inf}»`, sub:'Piensa en: «he …»', resp:[v.part], exp:`Se dice «he ${v.part}», no «he ${mal}».`};
  const op = uniq([v.part, mal, gerReg(v.inf), (VERBO[v.inf]?conj(VERBO[v.inf],'pps')[0]:reg(v.inf,'pps')[0])]);
  return {tipo:'test', tema:'Participios irregulares', enun:`¿Cuál es el participio de «${v.inf}»?`, sub:'Es la forma que va detrás de haber', opciones:shuffle(op), resp:v.part,
    exp:`El participio de ${v.inf} es irregular: «${v.part}» (he ${v.part}). Los regulares acaban en -ado / -ido.`};
}

/* ---- parser de frases ---- */
function parse(s){
  const out=[], re=/\{([^|}]+)\|([^}]+)\}|\[([^\]:]+):([^\]:]+):([^\]]+)\]|\[([^\]]+)\]|(\s+)|([\p{L}]+)|([^\s\p{L}{[]+)/gu;
  let m; while((m=re.exec(s))){
    if(m[1]) out.push({t:m[1], d:m[2]});
    else if(m[3]) out.push({t:m[3], adj:true, gn:m[4], lema:m[5]});
    else if(m[6]) out.push({t:m[6], grupo:true});
    else if(m[7]) out.push({sp:true});
    else if(m[8]) out.push({t:m[8]});
    else out.push({t:m[9], pu:true});
  }
  return out;
}
const DETS = DETS_SRC.map(parse), ADJS = ADJ_SRC.map(parse);
const fraseHTML = (toks, idx) => toks.map((k,i)=> k.sp ? ' ' : (i===idx||k.grupo) ? `<mark>${esc(k.t)}</mark>` : esc(k.t)).join('');

function elegirDet(tipos){
  const cand=[]; DETS.forEach((s,si)=>s.forEach((k,ki)=>{ if(k.d && tipos.includes(k.d)) cand.push([si,ki]); }));
  const [si,ki]=pick(cand); return {s:DETS[si], i:ki, k:DETS[si][ki]};
}
function qDetClase(tipos){
  const {s,i,k}=elegirDet(tipos);
  const otros = shuffle(Object.keys(DT).filter(x=>x!==k.d && (tipos.length>3 ? tipos.includes(x) : true))).slice(0,3);
  return {tipo:'test', tema:'Determinantes', enun:'¿Qué clase de determinante es la palabra marcada?', frase:fraseHTML(s,i),
    opciones: shuffle([k.d,...otros]).map(x=>DT[x]), resp:DT[k.d], exp:`«${k.t}» es ${DT[k.d].toLowerCase()}. ${DT_EXP[k.d]}`};
}
function qDetSub(){
  const {s,i,k}=elegirDet(['dem','art']); const st=subtipo(k);
  const preg = {dem:'¿Qué distancia indica este demostrativo?', art:'¿Qué tipo de artículo es?'}[k.d];
  const exp = {dem:'este/esta = cercanía · ese/esa = distancia media · aquel/aquella = lejanía.', art:'Determinados (algo conocido): el, la, los, las. Indeterminados (algo desconocido): un, una, unos, unas.'}[k.d];
  return {tipo:'test', tema:'Determinantes', enun:preg, frase:fraseHTML(s,i), opciones:SUBT[k.d].map(x=>x[0].toUpperCase()+x.slice(1)), resp:st[0].toUpperCase()+st.slice(1), exp:`«${k.t}»: ${st}. ${exp}`};
}

  const {s,k}=elegirDet(tipos);
  return {tipo:'tocar', tema:'Determinantes', enun:`Toca el determinante ${DT[k.d].toLowerCase()}`, toks:s.map(x=>({t:x.t, sp:x.sp, pu:x.pu, ok:x.d===k.d})),
    exp:DT_EXP[k.d]};
}

/* ---- raíz, desinencia y conjugación ---- */
function qRaiz(){
  let v,t,f,r; do { v=pick(REG_SIMPLE); t=TI[pick(IND_S)]; f=conj(v,t.id)[rnd(6)]; r=v.inf.slice(0,-2); } while(f.length < r.length+3);
  const ok = r+'-'+f.slice(r.length);
  const malas = [r.length-1, r.length+1, r.length+2].filter(n=>n>1 && n<f.length).map(n=>f.slice(0,n)+'-'+f.slice(n));
  return {tipo:'test', tema:'Raíz y desinencia', enun:`¿Cómo se separan la raíz y la desinencia de «${f}»?`, sub:`Verbo ${v.inf}`, opciones:shuffle(uniq([ok,...malas])), resp:ok,
    exp:`La raíz se obtiene quitando -ar, -er o -ir al infinitivo: ${r}-${v.inf.slice(-2)}. La desinencia «-${f.slice(r.length)}» indica persona, número, tiempo y modo.`};
}
function qConjugacion(){
  const v=pick([...REG,...IRR]), g=grupo(v.inf);
  const op=['1ª conjugación (-ar)','2ª conjugación (-er)','3ª conjugación (-ir)'];
  const conForma = Math.random()<.5 && v.inf!=='ir';
  const f = conForma ? conj(v,pick(IND_S))[rnd(6)] : v.inf;
  return {tipo:'test', tema:'Conjugaciones', enun:`¿A qué conjugación pertenece ${conForma?`«${f}»`:`el verbo «${f}»`}?`, sub:conForma?'Piensa en su infinitivo':'', opciones:op, resp:op[g],
    exp:`${conForma?`«${f}» es del verbo ${v.inf}. `:''}Los verbos en -ar son de la 1ª conjugación, en -er de la 2ª y en -ir de la 3ª.`};
}

/* ============ IMPERATIVO Y FORMAS NO PERSONALES ============ */
const IMP_P = [{k:'tu', pr:'tú', sp:1}, {k:'usted', pr:'usted', sp:2}, {k:'vos', pr:'vosotros/as', sp:4}, {k:'ustedes', pr:'ustedes', sp:5}];
function imperativo(v){
  const sp=conj(v,'spres');
  return {tu: IMP_TU[v.inf] || simple(v,'pres')[2], usted: sp[2], vos: v.inf.slice(0,-1)+'d', ustedes: sp[5]};
}
const IMP_VERBOS = [...REG_SIMPLE, ...IRR.filter(v=>!['poder','caber','querer','saber'].includes(v.inf))];
const IMP_IRR = IRR.filter(v=>IMP_TU[v.inf]);
const IMP_EXP = 'Imperativo: tú → como el presente de él (canta); vosotros → infinitivo cambiando -r por -d (cantad); usted y ustedes → presente de subjuntivo (cante, canten).';
function qImpEscribir(verbs){
  const v=pick(verbs), P=pick(IMP_P), f=imperativo(v)[P.k];
  return {tipo:'escribir', tema:'Imperativo', enun:`Da una orden con el verbo «${v.inf}»`, sub:`Imperativo · ${P.pr}`, resp:[f],
    exp:`${P.pr}: «¡${f}!». ${IMP_TU[v.inf]&&P.k==='tu'?`Es irregular: no se dice «${simple(v,'pres')[2]}».`:IMP_EXP}`};
}
function qImpTest(verbs){
  const v=pick(verbs), im=imperativo(v), P=pick(IMP_P), ok=im[P.k];
  const c = uniq([v.inf, simple(v,'pres')[2], conj(v,'spres')[1], simple(v,'pres')[4], ...Object.values(im)]).filter(x=>x!==ok);
  return {tipo:'test', tema:'Imperativo', enun:`¿Cuál es el imperativo de «${v.inf}» para ${P.pr}?`, opciones:shuffle([ok,...shuffle(c).slice(0,3)]), resp:ok,
    exp:`Se dice «¡${ok}!». ${P.k==='vos'?`Ojo: el infinitivo «${v.inf}» no sirve para dar órdenes.`:IMP_EXP}`};
}
function qImpPersona(){
  for(let k=0;k<30;k++){ const v=pick(IMP_VERBOS), im=imperativo(v), P=pick(IMP_P), f=im[P.k];
    if(Object.values(im).filter(x=>x===f).length>1) continue;
    return {tipo:'test', tema:'Imperativo', enun:`¿A quién va dirigida la orden «¡${f[0].toUpperCase()+f.slice(1)}!»?`, sub:`Verbo ${v.inf}`, opciones:IMP_P.map(x=>x.pr), resp:P.pr, exp:IMP_EXP}; }
  return qImpTest(IMP_VERBOS);
}
function qImpNeg(){
  const v=pick(REG_SIMPLE), P=pick([IMP_P[0], IMP_P[2]]), sp=conj(v,'spres'), im=imperativo(v);
  const ok='No '+sp[P.sp]; const mal=['No '+im[P.k], 'No '+v.inf, 'No '+(P.k==='tu'?sp[4]:sp[1])];
  return {tipo:'test', tema:'Orden negativa', enun:`Orden negativa con «${v.inf}» para ${P.pr}`, sub:'Prohibir algo: no + …', opciones:shuffle([ok,...mal]), resp:ok,
    exp:`Las órdenes negativas se forman con no + presente de subjuntivo: «${ok}». Nunca «${mal[0]}» ni «${mal[1]}».`};
}

const LETRAS = Object.entries(LETRAS_SRC).flatMap(([k,v])=>v.split(' ').map(x=>{const [ok,mal]=x.split('/'); return {ok,mal,k};}));
const EXCEPCIONES = ['óseo','óvalo','error','ermita','erguir','exquisito','anexión','conexión','crucifixión','flexión','reflexión','tejer','crujir','jengibre','lejía','ligero'];
function hueco(a,b){ let i=0; while(i<a.length && a[i]===b[i]) i++; let j=0; while(j<a.length-i && j<b.length-i && a[a.length-1-j]===b[b.length-1-j]) j++; return a.slice(0,i)+'_'+a.slice(a.length-j); }
const expLetra = w => (EXCEPCIONES.includes(w.ok) ? `«${w.ok}» es una excepción. ` : '') + REGLAS[w.k][1];
function qLetra(grupo){
  const w=pick(LETRAS.filter(x=>grupo.includes(x.k[0])));
  return {tipo:'test', tema:'Ortografía de letras', enun:'¿Cuál está bien escrita?', sub:`Completa: ${hueco(w.ok,w.mal)}`, opciones:shuffle([w.ok,w.mal]), resp:w.ok, exp:expLetra(w)};
}
function qLetraEscribir(grupo){
  const w=pick(LETRAS.filter(x=>grupo.includes(x.k[0])));
  return {tipo:'escribir', tema:'Ortografía de letras', enun:`Escribe la palabra completa: ${hueco(w.ok,w.mal)}`, sub:`Pista: ${w.ok.length} letras`, resp:[w.ok], estricto:true, exp:expLetra(w)};
}
function qLetraRegla(grupo){
  const w=pick(LETRAS.filter(x=>grupo.includes(x.k[0]) && !EXCEPCIONES.includes(x.ok)));
  const otras=shuffle(Object.keys(REGLAS).filter(k=>k!==w.k && grupo.includes(k[0]))).slice(0,3);
  return {tipo:'test', tema:'Reglas ortográficas', enun:`¿Qué regla explica cómo se escribe «${w.ok}»?`, opciones:shuffle([w.k,...otras]).map(k=>REGLAS[k][0]), resp:REGLAS[w.k][0], exp:REGLAS[w.k][1]};
}
function qExcepcion(grupo){
  const ex=pick(LETRAS.filter(x=>grupo.includes(x.k[0]) && EXCEPCIONES.includes(x.ok)));
  const normales=shuffle(LETRAS.filter(x=>x.k===ex.k && !EXCEPCIONES.includes(x.ok))).slice(0,3).map(x=>x.ok);
  return {tipo:'test', tema:'Excepciones', enun:'¿Cuál de estas palabras es una excepción a la regla?', opciones:shuffle([ex.ok,...normales]), resp:ex.ok, exp:expLetra(ex)};
}

      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+i*.11+.18); o.connect(g).connect(actx.destination); o.start(actx.currentTime+i*.11); o.stop(actx.currentTime+i*.11+.2); });
  }catch(e){}
}
function confeti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#conf'); c.hidden=false; const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement); const cols=['--c1','--c2','--c3','--c4','--accent'].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, vy:2+Math.random()*4, vx:-2+Math.random()*4, r:Math.random()*6, col:pick(cols), a:Math.random()*6}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.x+=p.vx; p.y+=p.vy; p.a+=.1; x.fillStyle=p.col; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillRect(-4,-7,8,14); x.restore();});
    if(++t<150) requestAnimationFrame(f); else { c.hidden=true; } })();
}

/* ---- partida ---- */
let G=null, timerId=null;
function nuevaPartida(modo, mi, ni){
  const qs=[], vistos=new Set();
  if(modo==='nivel'){
    const gen=MUNDOS[mi].niveles[ni].g;
    for(let k=0; qs.length<10 && k<200; k++){ const q=gen(); const key=q.enun+(q.sub||'')+(q.frase||''); if(vistos.has(key)) continue; vistos.add(key); q.mundo=MUNDOS[mi].id; qs.push(q); }
  } else if(modo==='repaso'){
    shuffle(P().fallos).slice(0,10).forEach(q=>qs.push({...q, deRepaso:true}));
  }
  G = {modo, mi, ni, qs, i:0, ok:0, racha:0, monedas:0, respondida:false, fin: modo==='crono' ? Date.now()+60000 : 0};
  if(modo==='crono'){ G.qs.push(genCrono()); timerId=setInterval(tick, 250); }
  vPregunta();
}
function genCrono(){
  const gens=[]; MUNDOS.forEach((m)=>m.niveles.forEach((n,ni)=>{ if(abierto(m.id,ni)) gens.push([m.id,n.g]); }));
  for(let k=0;k<30;k++){ const [mid,g]=pick(gens); const q=g(); if(q.tipo!=='escribir' && q.tipo!=='ordenar'){ q.mundo=mid; return q; } }
  const q=qIdent(IND_S,IND_S,REG_SIMPLE); q.mundo='tiempos'; return q;
}
function tick(){
  const s=Math.max(0, Math.ceil((G.fin-Date.now())/1000)); const el=$('#timer'); if(el) el.textContent=s+' s';
  if(s<=0){ clearInterval(timerId); timerId=null; vResultado(); }
}
const colorMundo = id => (MUNDOS.find(m=>m.id===id)||{col:'--accent'}).col;
function vPregunta(){
  const q=G.qs[G.i]; G.respondida=false;

  if(q.tipo==='ordenar'){ G.orden=[]; G.mezcla=shuffle(q.items.map((_,i)=>i));
    cuerpo = `<div class="order">${G.mezcla.map(i=>`<button class="oitem" data-ord="${i}"><span class="n"></span><span>${esc(q.items[i])}</span></button>`).join('')}</div>

    <div class="card"><span class="tema">${esc(q.tema)}${q.deRepaso?' · repaso':''}</span>
      <div class="enun">${esc(q.enun)}</div>${q.sub?`<div class="sub">${esc(q.sub)}</div>`:''}
      ${q.frase?`<div class="frase">${q.frase}</div>`:''}
      ${cuerpo}<div id="fb"></div></div></div>`;
  if(G.modo==='crono') tick();
  const inp=$('#resp'); if(inp) inp.focus();

function corregir(estado, detalle){ // estado: 'ok' | 'casi' | 'ko'
  if(G.respondida) return; G.respondida=true;
  const q=G.qs[G.i], p=P(), bien = estado!=='ko';
  const st = p.stats[q.mundo] = p.stats[q.mundo] || {ok:0,ko:0};
  const tm = p.temas[q.tema] = p.temas[q.tema] || {ok:0,ko:0};
  if(bien){ st.ok++; tm.ok++; G.ok++; G.racha++; const m = estado==='casi'?5:10+(G.racha>=3?5:0); G.monedas+=m; p.monedas+=m; p.rachaMax=Math.max(p.rachaMax,G.racha);
    if(q.deRepaso) p.fallos = p.fallos.filter(f=>!(f.enun===q.enun && f.sub===q.sub && f.frase===q.frase)); }
  else { st.ko++; tm.ko++; G.racha=0; const {deRepaso, ...limpio}=q;
    if(!p.fallos.some(f=>f.enun===q.enun && f.sub===q.sub && f.frase===q.frase)) { p.fallos.push(limpio); if(p.fallos.length>60) p.fallos.shift(); } }
  guardar(); sonar(bien);
  if(G.modo==='crono'){ setTimeout(()=>{ if(!G||G.modo!=='crono'||!timerId) return; G.qs.push(genCrono()); G.i++; vPregunta(); }, bien?350:1100);
    const fb=$('#fb'); fb.innerHTML = `<div class="fb ${bien?'good':'bad'}"><div class="body"><div class="t">${bien?'¡Bien!':'¡Uy!'}</div>${bien?'':`<p>${detalle}</p>`}</div></div>`; return; }
  const titulo = estado==='ok' ? pick(['¡Correcto!','¡Muy bien!','¡Genial!','¡Perfecto!']) : estado==='casi' ? '¡Casi! Ojo con la tilde' : 'No es correcto';
  $('#fb').innerHTML = `<div class="fb ${bien?'good':'bad'}"><div class="body"><div class="t">${titulo}</div>${detalle?`<p>${detalle}</p>`:''}<p>${esc(q.exp)}</p></div>
    <button class="btn" data-go="sig" id="sig">${G.i+1<G.qs.length?'Siguiente':'Ver resultado'}</button></div>`;
  $('#sig').focus({preventScroll:true}); $('#fb').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function vResultado(){

    txt = `<div class="bigstars">${[0,1,2].map(i=>`<span class="${i<e?'on':''}">★</span>`).join('')}</div>` + txt + `<div class="score">${G.ok} / ${tot}</div>`;
    if(e===3) confeti();

  p.sesiones.unshift({f:Date.now(), modo:G.modo, m:G.modo==='nivel'?MUNDOS[G.mi].nombre+' · '+(G.ni+1):G.modo==='crono'?'Contrarreloj':'Repaso', ok:G.ok, tot:G.modo==='crono'?null:G.qs.length});

}

    <h3>Formas no personales</h3><p>No indican persona ni número.</p><div class="tbl"><table><thead><tr><th></th><th>amar</th><th>comer</th><th>vivir</th></tr></thead><tbody>
    ${FNP.map((n,i)=>`<tr><th>${n}</th>${['amar','comer','vivir'].map(x=>{const v=VERBO[x]; return `<td>${[v.inf,gerundio(v),part(v),'haber '+part(v),'habiendo '+part(v)][i]}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`; }
  if(m.id==='signos') h = `<p>El <b>punto y coma</b> indica una pausa más larga que la coma y un poco más corta que el punto.</p>` + Object.keys(SIG).map(k=>`<h3>${SIG[k].n}</h3><ul>${Object.keys(USOS).filter(u=>USOS[u][0]===k).map(u=>`<li>${USOS[u][1]}: <i>${esc(SIG_EJ.find(x=>x[0]===u)[1])}</i></li>`).join('')}</ul>`).join('');
  if(m.id==='letras') h = [['h','Palabras con h'],['x','Se escriben con x'],['s','Se escriben con s'],['g','Se escriben con g'],['j','Se escriben con j']].map(([l,t])=>`<h3>${t}</h3><ul>${Object.keys(REGLAS).filter(k=>k[0]===l).map(k=>`<li>${REGLAS[k][1]}</li>`).join('')}</ul>`).join('');
  if(m.id==='ortografia') h = `<h3>Palabras compuestas</h3><p>Se forman a partir de la unión de dos o más palabras simples: <i>sacapuntas, girasol</i>. Se acentúan siguiendo las <b>reglas generales de acentuación</b>, ya que se consideran una sola palabra: <i>hidroavión, undécimo</i>. Al unirse pueden sufrir algún cambio ortográfico: cien + pies → <b>ciempiés</b>.</p>
    <h3>Adverbios acabados en -mente</h3><p>Se forman a partir de adjetivos y no se les aplican las reglas generales. Si el adjetivo lleva tilde, el adverbio también: práctico → <b>prácticamente</b>; nuevo → <b>nuevamente</b>.</p>
    <h3>Tilde diacrítica</h3><p>Por regla general, las palabras monosílabas no llevan tilde: <i>le, dio, pie</i>. La tilde diacrítica sirve para diferenciar palabras que se escriben igual pero tienen distinto significado.</p>
    <div class="tbl"><table><thead><tr><th>Palabra</th><th>Clase</th><th>Ejemplo</th></tr></thead><tbody>
    ${[['té','Por las mañanas siempre tomo té negro.'],['te','Te he comprado batido de chocolate.'],['tú','Tú vas a clase de canto.'],['tu','Tu gato es muy gracioso.'],['dé','Espero que se dé prisa.'],['de','El vecino de mi abuela es francés.'],['sí','Pau habla para sí mismo. Me dijo que sí.'],['si','Si quieres, vamos a merendar.'],['sé','No sé dónde está. Sé amable con ellos.'],['se','Se lo conté cuando nos vimos.'],['mí','Este regalo es para mí.'],['mi','Mi hermano juega al baloncesto.'],['él','Él trajo la pelota.'],['el','El perro ladra mucho.']].map(([w,e])=>`<tr><td><b>${w}</b></td><td>${DIACR[w]}</td><td><i>${e}</i></td></tr>`).join('')}</tbody></table></div>
    <p>Qué, quién, cómo, cuándo, dónde, por qué y cuál siempre llevan tilde cuando tienen sentido <b>interrogativo o exclamativo</b>: <i>¿qué pasa?, ¿cuál es la calle?, ¿quién va?</i></p>`;
  if(m.id==='recursos') h = `<p>Los <b>recursos literarios</b> son figuras que se emplean en textos, tanto en verso como en prosa, para dar expresividad y conseguir un efecto específico.</p>
    <div class="tgrid">${Object.keys(REC).map(k=>`<div class="tbox"><b>${REC[k].n}</b><p style="margin:4px 0 0">${REC[k].d}</p><p class="muted" style="margin:4px 0 0"><i>${REC_EJ.find(x=>x[0]===k)[1]}</i></p></div>`).join('')}</div>
    <h3>Truco: metáfora o comparación</h3><p>Si aparece <b>como</b>, <b>igual que</b> o <b>parece</b>, es comparación (tus ojos son <b>como</b> luceros). Si no aparece, es metáfora (tus ojos son luceros).</p>`;
  if(m.id==='historico') h = `<p>Los <b>textos históricos</b> narran acontecimientos relevantes del pasado ordenados de manera cronológica, de más antiguo a más moderno. Utilizan <b>conectores temporales</b> para organizar la información (más tarde, antes, después…) e incluyen gran cantidad de datos y fechas. Se escriben en <b>pasado</b> o en <b>presente histórico</b>. Suelen ir acompañados de mapas, imágenes u organizadores gráficos.</p>
    <h3>Estructura</h3><div class="tgrid">${PARTES.map(x=>`<div class="tbox"><b>${x}</b><p style="margin:4px 0 0">${PARTES_EXP[x]}</p></div>`).join('')}</div>
    <h3>Lecturas del juego</h3>${TEXTOS.map(T=>`<div class="lectura"><span class="parte">Título</span><h3 style="margin:2px 0 4px">${T.t}</h3><span class="parte">Introducción</span><p>${T.i}</p><span class="parte">Desarrollo</span><p>${T.d}</p><span class="parte">Conclusión</span><p>${T.c}</p></div>`).join('')}`;
  if(m.id==='adjetivos') h = `<p>El <b>adjetivo calificativo</b> dice cómo es el sustantivo y concuerda con él en género y número (casa blanca, coches blancos).</p>
    <h3>Grados del adjetivo</h3><div class="tgrid">${Object.keys(GR).map(k=>`<div class="tbox"><b>${GR[k]}</b><p style="margin:4px 0 0">${GR_EXP[k]}</p></div>`).join('')}</div>
    <h3>Formas especiales</h3><div class="tbl"><table><thead><tr><th>Positivo</th><th>Comparativo</th><th>Superlativo culto</th></tr></thead><tbody>${CULTOS.map(c=>`<tr><td>${c.b}</td><td>${c.comp}</td><td>${c.sup}</td></tr>`).join('')}</tbody></table></div>
    <h3>Superlativos en -ísimo</h3><p>${SUPER.slice(0,12).map(([b,r])=>`${b} → <b>${r[0]}</b>`).join(' · ')}</p>`;
  app.innerHTML = cabecera() + `<div class="card theory" style="--wc:var(${m.col})"><div class="gbar"><button class="x" data-go="mapa" aria-label="Volver">←</button><h2 style="margin:0">${m.nombre}</h2></div>${h}
    <div class="row"><button class="btn" data-go="mapa">Volver al mapa</button></div></div>`;
}

/* ---- familia ---- */
let famTab=null, borrar=false;
function vFamilia(){
  famTab = famTab || S.actual; const p=S.perfiles[famTab];
  const barras = MUNDOS.map(m=>{ const s=p.stats[m.id]||{ok:0,ko:0}, n=s.ok+s.ko, pc=n?Math.round(s.ok/n*100):0;
    return `<div class="bar"><b>${m.nombre}</b><div class="tr"><i style="width:${pc}%;background:var(${m.col})"></i></div><span>${n?pc+'%':'—'}</span></div>`; }).join('');
  const temas = Object.entries(p.temas).filter(([,s])=>s.ok+s.ko>=3).map(([t,s])=>[t,s.ok/(s.ok+s.ko),s.ok+s.ko]).sort((a,b)=>a[1]-b[1]).slice(0,6);
  app.innerHTML = cabecera() + `<div class="card"><div class="gbar"><button class="x" data-go="mapa" aria-label="Volver">←</button><h2 style="margin:0">Zona familia</h2></div>
    <div class="tabs">${Object.entries(S.perfiles).map(([id,pp])=>`<button data-tab="${id}" aria-pressed="${id===famTab}"><span class="mini">${avaHTML(pp.avatar)}</span> ${esc(pp.nombre)}</button>`).join('')}</div>
    <p class="muted">El progreso se guarda en esta tablet. ${esc(p.nombre)} tiene ${p.monedas} monedas, mejor racha ${p.rachaMax} y récord de contrarreloj ${p.crono}.</p>
    <h3>Aciertos por mundo</h3><div class="bars">${barras}</div>
    <h3 style="margin-top:18px">Lo que más le cuesta</h3>${temas.length?`<ul class="list">${temas.map(([t,r,n])=>`<li><span>${esc(t)}</span><b>${Math.round(r*100)}% de ${n}</b></li>`).join('')}</ul>`:'<p class="muted">Todavía hay pocos datos.</p>'}
    <h3 style="margin-top:18px">Últimas partidas</h3>${p.sesiones.length?`<ul class="list">${p.sesiones.slice(0,8).map(s=>`<li><span>${new Date(s.f).toLocaleDateString('es-ES',{day:'numeric',month:'short'})} · ${esc(s.m)}</span><b>${s.ok}${s.tot?' / '+s.tot:' aciertos'}</b></li>`).join('')}</ul>`:'<p class="muted">Aún no ha jugado.</p>'}
    <h3 style="margin-top:18px">Avatar</h3><div class="avs">${AVATARES.map(a=>`<button data-av="${a}" aria-pressed="${a===p.avatar}">${avaHTML(a)}</button>`).join('')}</div>
    <h3 style="margin-top:18px">Ajustes</h3>
    <div class="row" style="justify-content:flex-start"><button class="btn sec sm" data-go="borrar">Borrar progreso de ${esc(p.nombre)}</button></div>
    ${borrar?`<div class="confirm"><span>¿Seguro? Se borrarán estrellas, monedas y estadísticas de ${esc(p.nombre)}.</span><button class="btn sm" data-go="borrarsi">Sí, borrar</button><button class="btn sec sm" data-go="borrarno">Cancelar</button></div>`:''}
  </div>`;
}

/* ============ EVENTOS ============ */
app.addEventListener('click', ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.perfil){ S.actual=d.perfil; guardar(); return vMapa(); }
  if(d.nivel){ const [mi,ni]=d.nivel.split(':').map(Number); return nuevaPartida('nivel',mi,ni); }
  if(d.bloq){ const a=$('#aviso'); if(a) a.textContent='Consigue 2 estrellas en el nivel anterior para abrir este.'; return; }
  if(d.teoria){ vTeoria(+d.teoria); return scrollTo(0,0); }
  if(d.tab){ famTab=d.tab; borrar=false; return vFamilia(); }
  if(d.av){ S.perfiles[famTab].avatar=d.av; guardar(); return vFamilia(); }
  if(d.k){ const i=$('#resp'); if(i){ const s=i.selectionStart??i.value.length; i.value=i.value.slice(0,s)+d.k+i.value.slice(i.selectionEnd??s); i.focus(); i.setSelectionRange(s+1,s+1);} return; }
  if(d.op!==undefined && G && !G.respondida){ const q=G.qs[G.i], el=q.opciones[+d.op], ok=el===q.resp;
    document.querySelectorAll('.opt').forEach(o=>{ o.disabled=true; if(q.opciones[+o.dataset.op]===q.resp) o.classList.add('good'); }); if(!ok) b.classList.add('bad');
    return corregir(ok?'ok':'ko', ok?'':`La respuesta correcta es: <b>${esc(q.resp)}</b>.`); }
  if(d.vf!==undefined && G && !G.respondida){ const q=G.qs[G.i], r=d.vf==='1', ok=r===q.resp;
    document.querySelectorAll('.opt').forEach(o=>{ o.disabled=true; if((o.dataset.vf==='1')===q.resp) o.classList.add('good'); }); if(!ok) b.classList.add('bad');
    return corregir(ok?'ok':'ko', ok?'':`Era <b>${q.resp?'verdadero':'falso'}</b>.`); }
  if(d.ord!==undefined && G && !G.respondida){ const i=+d.ord; if(G.orden.includes(i)) return;
    G.orden.push(i); b.classList.add('sel'); b.querySelector('.n').textContent=G.orden.length;
    const q=G.qs[G.i]; if(G.orden.length<q.items.length) return;
    const ok=G.orden.every((x,k)=>x===k);
    document.querySelectorAll('.oitem').forEach(o=>{ o.disabled=true; const j=+o.dataset.ord; o.classList.add(G.orden.indexOf(j)===j?'good':'bad'); });
    document.querySelector('[data-go="ordreset"]').disabled=true;
    return corregir(ok?'ok':'ko', ok?'':'Fíjate en las fechas y en los conectores temporales.'); }
  if(d.w!==undefined && G && !G.respondida){ const q=G.qs[G.i], ok=q.toks[+d.w].ok;
    document.querySelectorAll('.word').forEach(w=>{ w.disabled=true; if(q.toks[+w.dataset.w].ok) w.classList.add('good'); }); if(!ok) b.classList.add('bad');
    return corregir(ok?'ok':'ko', ok?'':'Mira las palabras en verde.'); }
  switch(d.go){
    case 'perfil': return vPerfiles();
    case 'ordreset': if(G && !G.respondida){ G.orden=[]; document.querySelectorAll('.oitem').forEach(o=>{o.classList.remove('sel'); o.querySelector('.n').textContent='';}); } return;
    case 'sonido': S.sonido=!S.sonido; guardar(); b.textContent=S.sonido?'🔊':'🔇'; return;
    case 'mapa': G=null; borrar=false; vMapa(); return scrollTo(0,0);
    case 'salir': if(timerId){clearInterval(timerId); timerId=null;} G=null; return vMapa();
    case 'sig': G.i++; if(G.i>=G.qs.length) return vResultado(); vPregunta(); return scrollTo(0,0);
    case 'otra': return nuevaPartida(G.modo, G.mi, G.ni);
    case 'crono': return nuevaPartida('crono');
    case 'repaso': return nuevaPartida('repaso');
    case 'familia': famTab=S.actual; borrar=false; return vFamilia();
    case 'borrar': borrar=true; return vFamilia();
    case 'borrarno': borrar=false; return vFamilia();
    case 'borrarsi': { const p=S.perfiles[famTab]; S.perfiles[famTab]=perfilNuevo(p.nombre,p.avatar); borrar=false; guardar(); return vFamilia(); }
  }
});
app.addEventListener('submit', ev=>{
  ev.preventDefault(); if(!G || G.respondida) return;
  const q=G.qs[G.i], inp=$('#resp'), v=norm(inp.value); if(!v) return;
  const exacto = q.resp.some(r=>norm(r)===v), casi = !exacto && !q.estricto && q.resp.some(r=>sinTilde(norm(r))===sinTilde(v));
  inp.disabled=true; inp.classList.add(exacto||casi?'good':'bad');
  document.querySelectorAll('.write button, .keys button').forEach(x=>x.disabled=true);
  corregir(exacto?'ok':casi?'casi':'ko', exacto?'':`Se escribe: <b>${esc(q.resp[0])}</b>.`);
});
app.addEventListener('change', ev=>{ if(ev.target.id==='selv') $('#tablas').innerHTML=tablasDe(ev.target.value); });
document.addEventListener('keydown', ev=>{ if(ev.key==='Enter' && G && G.respondida && $('#sig') && document.activeElement?.id!=='resp'){ ev.preventDefault(); $('#sig').click(); } });

cargar();
if(S.actual && S.perfiles[S.actual]) vMapa(); else vPerfiles();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body></html>
